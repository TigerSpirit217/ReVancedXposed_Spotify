name: Android Test Build

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to build"
        required: true
        default: "main"
        type: string

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0
          submodules: true

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          java-version: 'latest'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Read build metadata
        id: metadata
        run: |
          version_code=$(git rev-list --count HEAD)
          package_name_seed=$(shuf -i 1-10000 -n 1)
          {
            echo "version_code=$version_code"
            echo "package_name_seed=$package_name_seed"
          } >> "$GITHUB_OUTPUT"

      - name: Build Release APK
        run: ./gradlew assembleUniversalRelease -PPACKAGE_NAME_SEED="$PACKAGE_NAME_SEED" -PVERSION_CODE="$VERSION_CODE"
        env:
          PACKAGE_NAME_SEED: ${{ steps.metadata.outputs.package_name_seed }}
          VERSION_CODE: ${{ steps.metadata.outputs.version_code }}

      - name: Upload Test APK
        uses: actions/upload-artifact@v7
        with:
          name: rvxp-test-${{ inputs.branch }}-${{ steps.metadata.outputs.version_code }}
          path: |
            app/build/outputs/apk/universal/release/*.apk
            app/build/outputs/mapping/universalRelease/mapping.txt
